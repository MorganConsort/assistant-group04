<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 2rem 1rem;
      background: #f3f4f6;
      color: #1f2937;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgb(0 0 0 / 8%);
    }

    header {
      padding: 1.5rem;
      background: #1d4ed8;
      color: #ffffff;
    }

    header h1 {
      margin: 0 0 0.5rem;
    }

    header p {
      margin: 0;
    }

    .conversation {
      min-height: 240px;
      padding: 1.5rem;
    }

    .assistant-message {
      max-width: 85%;
      padding: 1rem;
      background: #e5e7eb;
      border-radius: 10px;
    }

    form {
      padding: 1.5rem;
      border-top: 1px solid #d1d5db;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 0.75rem;
      border: 1px solid #9ca3af;
      border-radius: 6px;
      font: inherit;
    }

    input:focus {
      outline: 3px solid #bfdbfe;
      border-color: #1d4ed8;
    }

    button {
      padding: 0.75rem 1.25rem;
      border: 0;
      border-radius: 6px;
      background: #1d4ed8;
      color: #ffffff;
      font: inherit;
      font-weight: bold;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .status {
      margin: 0.75rem 0 0;
      color: #4b5563;
      font-size: 0.9rem;
    }

    @media (max-width: 520px) {
      .input-row {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Study Assistant</h1>
      <p>Ask questions about university offices and services.</p>
    </header>

    <section
      class="conversation"
      aria-label="Conversation"
      aria-live="polite"
    >
      <div class="assistant-message">
        Hello! Ask me where an office is or when it opens.
      </div>
    </section>

    <form>
      <label for="question">Your question</label>

      <div class="input-row">
        <input
          id="question"
          name="question"
          type="text"
          placeholder="For example: Where is the Training Office?"
          aria-describedby="placeholder-status"
        >

        <button type="button" disabled>Send</button>
      </div>

      <p id="placeholder-status" class="status">
        Static placeholder—the interactive Streamlit version will be added later.
      </p>
    </form>
  </main>
</body>
</html>
